name: Localize fingerprint updater WebUI once
on:
  push:
    branches: ['integration/copg-v6.13-vd-43856574245-1']
    paths: ['.github/workflows/localize-updater-once.yml']
permissions:
  contents: write
concurrency:
  group: localize-updater-integration
  cancel-in-progress: false
jobs:
  localize:
    if: github.repository == 'wfire06100/TOPG' && github.ref == 'refs/heads/integration/copg-v6.13-vd-43856574245-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/copg-v6.13-vd-43856574245-1
      - name: Localize presentation only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('module/webroot/scripts.js')
          text = p.read_text()
          helper = Path('tools/tee/updater_messages.js').read_text()
          assert 'function formatUpdaterMessage(' not in text, 'Already localized'
          old = """    lines.filter(line => line.startsWith('[COPG-VD]'))
                   .forEach(line => appendToOutput(line.replace('[COPG-VD] ', ''), 'info'));
              const status = (lines.find(line => line.startsWith('status:')) || '').replace('status:', '').trim();"""
          new = """    const status = (lines.find(line => line.startsWith('status:')) || '').replace('status:', '').trim();
              lines.filter(line => line.startsWith('[COPG-VD]')).forEach(line => {
                  const message = formatUpdaterMessage(line.replace('[COPG-VD] ', ''), status);
                  if (message !== null) appendToOutput(message, 'info');
              });"""
          assert text.count(old) == 1, 'Updater display anchor changed'
          text = text.replace(old, new, 1)
          for label in ['Updating COPG-VD.json from GitHub...', 'Checking GitHub for a newer build...', 'Analyzing the config as it stands...', 'Running the updater...']:
              old = "'" + label + "'"
              assert text.count(old) == 1, 'Updater label changed: ' + label
              text = text.replace(old, 'formatUpdaterMessage(' + old + ')', 1)
          p.write_text(helper + '\n' + text)
          p = Path('module/webroot/lang/fr.json')
          data = json.loads(p.read_text())
          assert data['msg_046'] == 'Déjà sur le build le plus récent', 'French message changed'
          data['msg_046'] = 'Le profil est déjà à jour.'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Validate messages and build patches
        run: |
          set -eu
          node tests/updater-messages.test.js
          node --check module/webroot/scripts.js
          python3 tests/fingerprint-channel.test.py
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          cp -a module tests "$sandbox/"
          python3 tools/tee/webui_patch_sync.py "$sandbox/module/webroot/scripts.js"
          python3 tools/tee/fix_navigation.py "$sandbox/module/webroot/scripts.js"
          git diff --check
      - name: Commit only localized WebUI
        run: |
          set -eu
          rm .github/workflows/localize-updater-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- module/webroot/scripts.js module/webroot/lang/fr.json .github/workflows/localize-updater-once.yml
          git commit -m 'fix(webui): localize fingerprint messages and deduplicate up-to-date summary'
          git push origin HEAD:refs/heads/integration/copg-v6.13-vd-43856574245-1
