name: Dispatch approved TOPG release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-topg-release.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'wfire06100/TOPG' && github.event.head_commit.message == 'release: publish TOPG with English notices'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request the existing TOPG release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$head" = "$GITHUB_SHA" || { echo 'main changed; release dispatch stopped for review.'; exit 1; }
          gh workflow run COPG-VD.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'TOPG release build requested on main. Publication depends on successful build and verification.' >> "$GITHUB_STEP_SUMMARY"
