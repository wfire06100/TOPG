name: Fix Canary channel and updater status once
on:
  push:
    branches: ['integration/copg-v6.13-vd-43856574245-1']
    paths: ['.github/workflows/fix-canary-once.yml']
permissions:
  contents: write
concurrency:
  group: fix-canary-integration
  cancel-in-progress: false
jobs:
  fix:
    if: github.repository == 'wfire06100/TOPG' && github.ref == 'refs/heads/integration/copg-v6.13-vd-43856574245-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/copg-v6.13-vd-43856574245-1
      - name: Apply targeted fixes without changing backup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('module/fingerprint-update.sh')
          backup = Path('backups/fingerprint-update/pre-replacement.sh')
          original_backup = backup.read_bytes()
          text = p.read_text()
          start = text.index('detect_channel_from_fingerprint() {')
          end = text.index('update_non_tegu_profile() {', start)
          replacement = '''detect_channel_from_fingerprint() {
              conf=""
              for p in $CONFIG_PATHS; do [ -f "$p" ] && conf="$p" && break; done
              [ -f "$conf" ] || return 1
              fp=$(json_get "$conf" FINGERPRINT | tr '[:upper:]' '[:lower:]')
              preview=$(json_get "$conf" PREVIEW_SDK)
              case "$fp" in */*/*:*/*/*:*) ;; *) return 1 ;; esac
              release=${fp#*:}; release=${release%%/*}
              case "$release" in
                  *canary*|*preview*) echo canary; return ;;
              esac
              case "$fp" in
                  *canary*|*preview*) echo canary; return ;;
                  *beta*) echo beta; return ;;
              esac
              case "$preview" in ''|0) ;; *) return 1 ;; esac
              case "$release" in ''|*[!0-9.]*) return 1 ;; esac
              echo release
          }

          '''
          text = text[:start] + replacement + text[end:]
          old = '        channel=$(detect_channel_from_fingerprint)'
          assert text.count(old) == 1, 'Channel assignment changed'
          text = text.replace(old, old + ' || { log "channel ambiguous; select a profile explicitly" >&2; return 1; }', 1)
          old = '    sh "$0" fetch "$relpath" || return 1'
          assert text.count(old) == 1, 'Fetch call changed'
          replacement = '''    if fetch_output=$(sh "$0" fetch "$relpath"); then
                  fetch_rc=0
              else
                  fetch_rc=$?
              fi
              printf '%s\\n' "$fetch_output" | sed '/^status:/d'
              if [ "$fetch_rc" -ne 0 ]; then
                  log "profile fetch failed rc=$fetch_rc" >&2
                  return 1
              fi
              if ! printf '%s\\n' "$fetch_output" | grep -qx 'status: fetched'; then
                  log "profile fetch returned no success status" >&2
                  return 1
              fi'''
          text = text.replace(old, replacement, 1)
          text = '\n'.join(line.rstrip(' \t') for line in text.splitlines()) + '\n'
          subprocess.run(['sh', '-n'], input=text, text=True, check=True)
          p.write_text(text)
          assert backup.read_bytes() == original_backup, 'Backup modified'
          PY
      - name: Test raw and build-patched updater
        run: |
          set -eu
          python3 tests/fingerprint-channel.test.py
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          cp -a module tests "$sandbox/"
          python3 tools/tee/webui_patch_sync.py "$sandbox/module/webroot/scripts.js"
          (cd "$sandbox" && python3 tests/fingerprint-channel.test.py)
          sh -n "$sandbox/module/fingerprint-update.sh"
          git diff --check
      - name: Commit validated fixes only to integration
        run: |
          set -eu
          rm .github/workflows/fix-canary-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- module/fingerprint-update.sh tests/fingerprint-channel.test.py .github/workflows/fix-canary-once.yml
          git commit -m 'fix(fingerprint): preserve Canary channel and emit final apply status'
          git push origin HEAD:refs/heads/integration/copg-v6.13-vd-43856574245-1
