name: Replace fingerprint updater once
on:
  push:
    branches: ['integration/copg-v6.13-vd-43856574245-1']
    paths: ['.github/workflows/replace-fingerprint-once.yml']
permissions:
  contents: write
concurrency:
  group: replace-fingerprint-integration
  cancel-in-progress: false
jobs:
  replace:
    if: github.repository == 'wfire06100/TOPG' && github.ref == 'refs/heads/integration/copg-v6.13-vd-43856574245-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/copg-v6.13-vd-43856574245-1
      - name: Back up and replace reviewed updater sections
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          p = Path('module/fingerprint-update.sh')
          old = p.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(old)).encode() + b'\0' + old).hexdigest()
          assert actual == '0f1dc4d7be739ec60b6525b0989619d8eccdf9cb', 'Updater changed; review before replacing: ' + actual
          backup = Path('backups/fingerprint-update/pre-replacement.sh')
          assert not backup.exists(), 'Refusing to overwrite backup'
          # Reviewed additions and command dispatch from the user-provided script.
          payload = ''
          additions, dispatch = json.loads(lzma.decompress(base64.b64decode(payload)))
          text = old.decode()
          assert text.count('compare() {') == 1
          assert text.count('MODE="${1:-check}"') == 1
          start = text.index('MODE="${1:-check}"')
          end = text.index('    analyze)\n', start)
          text = text[:start] + dispatch + text[end:]
          text = text.replace('compare() {', additions + 'compare() {', 1)
          subprocess.run(['sh', '-n'], input=text, text=True, check=True)
          backup.parent.mkdir(parents=True, exist_ok=True)
          backup.write_bytes(old)
          p.write_text(text)
          assert backup.read_bytes() == old
          Path('.github/workflows/replace-fingerprint-once.yml').unlink()
          PY
      - name: Validate isolated build patch and backup scope
        run: |
          set -eu
          sh -n module/fingerprint-update.sh
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          cp -a module "$sandbox/module"
          python3 tools/tee/webui_patch_sync.py "$sandbox/module/webroot/scripts.js"
          sh -n "$sandbox/module/fingerprint-update.sh"
          test -f backups/fingerprint-update/pre-replacement.sh
          test ! -e "$sandbox/module/backups"
          git diff --check
      - name: Commit only to integration
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- module/fingerprint-update.sh backups/fingerprint-update/pre-replacement.sh .github/workflows/replace-fingerprint-once.yml
          git commit -m 'feat(fingerprint): support device channels with safe update results'
          git push origin HEAD:refs/heads/integration/copg-v6.13-vd-43856574245-1
